<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鑊仔食譜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 卡通藍綠廚房：粗墨線 + 平塗色 + 厚底陰影；手機用底部分頁，闊螢幕轉左側欄 */
  --ink:#10393b;
  --bg:#d9f2ee;
  --paper:#ffffff;
  --teal:#15a596;
  --teal-deep:#0b6f66;
  --mint:#bdeee6;
  --sun:#ffd25e;
  --coral:#ff8f7a;
  --muted:#4a6f6c;
  --line:#c3e3de;
  --c-pro:#0f8f83; --c-carb:#d4940f; --c-fat:#5b6ee1;
  --f-display:"Huninn","jf open 粉圓","Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif;
  --f-num:"Fredoka","Huninn",ui-rounded,sans-serif;
  --r:20px;
  --sh:0 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(16,57,59,.09) 1.6px,transparent 0);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:22px} h3{font-size:18px} h4{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}
svg{display:block}

/* ---------- 版面 ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.main-col{min-width:0}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
.brand-m{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:21px;white-space:nowrap;flex:none}
#timerChip{white-space:nowrap;font-family:var(--f-num);font-weight:600}
.sync{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.brand-m{font-size:18px}.brand-m svg{width:32px;height:32px}}
.brand-m svg{width:40px;height:40px}
.sync{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px;border:2px solid var(--ink);background:var(--paper);white-space:nowrap}
.sync{cursor:pointer;font-family:var(--f-display);display:inline-flex;align-items:center;gap:6px}
.sync.ok{background:var(--mint)}
.sync.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 2px var(--ink);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.mchip{display:inline-flex;align-items:center;gap:5px;border:2.5px solid var(--ink);border-radius:99px;background:var(--paper);padding:2px 10px 2px 2px;font-family:var(--f-display);font-size:13.5px}
.mav{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:inline-grid;place-items:center;overflow:hidden;flex:none}
.mav svg{width:24px;height:24px}
.mav.lg{width:38px;height:38px}.mav.lg svg{width:36px;height:36px} .sync.warn{background:#ffe9b0}
main{padding:16px 16px 120px;max-width:1080px;margin:0 auto;width:100%}
.view{display:none;flex-direction:column;gap:18px}
.view.on{display:flex;animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  background:var(--paper);border-top:3px solid var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 0;font-size:11.5px;font-family:var(--f-display);color:var(--muted);position:relative;border-radius:14px}
.tab svg{width:26px;height:26px;padding:2px;border-radius:10px}
.tab.on{color:var(--ink)}
.tab.on svg{background:var(--sun);box-shadow:0 0 0 2px var(--ink)}
.tab .badge{position:absolute;top:0;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);border:2px solid var(--ink);font-size:10.5px;line-height:14px;color:var(--ink);font-family:var(--f-num);font-weight:700}
.nav-brand{display:none}
@media (min-width:900px){
  .app{grid-template-columns:210px 1fr}
  nav.tabs{position:sticky;top:0;align-self:start;height:100dvh;grid-template-columns:1fr;grid-auto-rows:min-content;gap:6px;border-top:0;border-right:3px solid var(--ink);padding:18px 14px}
  .tab{flex-direction:row;gap:10px;font-size:16px;padding:8px 10px;justify-content:flex-start}
  .tab:hover{background:var(--bg)}
  .tab .badge{position:static;margin-left:auto}
  .nav-brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;margin-bottom:14px}
  .nav-brand svg{width:48px;height:48px}
  header.top .brand-m{display:none}
  main{padding:22px 28px 60px}
}

/* ---------- 元件 ---------- */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card.tint{background:var(--mint)}
.card.sun{background:#fff4cf}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h .ic{width:44px;height:44px;flex:none;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;overflow:hidden}
.sec-h .ic svg{width:40px;height:40px}
.sec-h .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--ink);border-radius:99px;background:var(--paper);padding:8px 16px;font-family:var(--f-display);font-size:15px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--teal);color:#fff}
.btn.sun{background:var(--sun)}
.btn.coral{background:var(--coral)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-width:2.5px;box-shadow:0 2px 0 var(--ink)}
.btn.icon{width:38px;height:38px;padding:0;border-radius:12px}
.btn.icon.sm{width:32px;height:32px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{border:2.5px solid var(--ink);border-radius:99px;background:var(--paper);padding:5px 12px;font-size:13.5px;font-family:var(--f-display);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"],.chip.on{background:var(--teal);color:#fff}
.chip svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:99px;border:2px solid var(--ink);background:var(--paper);font-family:var(--f-display);white-space:nowrap}
.pill.mint{background:var(--mint)} .pill.sun{background:var(--sun)} .pill.coral{background:var(--coral)} .pill.ink{background:var(--ink);color:#fff}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gcards{grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
@media (min-width:640px){.gcards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-display);font-size:13.5px}
.inp,select.inp,textarea.inp{width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:8px 12px;font-size:15px;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.inp:focus{outline:none;box-shadow:0 0 0 3px var(--sun)}
.stepper{display:inline-flex;align-items:center;border:3px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.stepper button{border:0;background:var(--mint);width:34px;height:32px;font-size:18px;font-family:var(--f-num);font-weight:700}
.stepper span{min-width:44px;text-align:center;font-family:var(--f-num);font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 8px;color:var(--muted)}
.empty svg{width:96px;height:96px}

/* 插圖框 */
.ill{position:relative;display:grid;place-items:center;border-radius:16px;border:3px solid var(--ink);overflow:hidden}
.ill svg{width:78%;height:78%}
.ill img{width:100%;height:100%;object-fit:cover}
.ill .src{position:absolute;top:8px;left:8px}
.mini-ings{display:flex;gap:2px;margin-top:2px}
.mini-ings span{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--ink)}
.mini-ings svg{width:22px;height:22px}

/* 食譜卡 */
.rcard{display:flex;flex-direction:column;gap:8px;padding:10px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);transition:transform .12s}
.rcard:hover{transform:translateY(-2px) rotate(-.4deg)}
.rcard .ill{aspect-ratio:4/3}
.rcard h4{font-size:16.5px}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:15px}
.fav.on{background:var(--coral)}

/* 首頁 */
.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--teal);color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:28px;color:#fff}
.hero p{margin:4px 0 12px;color:#e6fffb}
.hero .mascot{width:100%;height:100%;animation:bob 3s ease-in-out infinite}
.hero .deco{position:absolute;width:44px;height:44px;opacity:.95}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:2px;text-align:left}
.tile .v{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1}
.tile .l{font-size:12.5px;color:var(--muted);font-family:var(--f-display)}
.tile.warn{background:#fff1c9}
.meal{display:flex;flex-direction:column;gap:8px;padding:12px;border:3px dashed var(--line);border-radius:16px;background:#f6fcfb}
.meal-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display)}
.meal-h .spacer{flex:1}
.dish{display:flex;align-items:center;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 8px;text-align:left;width:100%}
.dish .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;border:2px solid var(--ink);overflow:hidden}
.dish .ic svg{width:38px;height:38px}
.dish .ic img{width:100%;height:100%;object-fit:cover}
.dish .nm{font-family:var(--f-display);font-size:15px;line-height:1.25}
.dish .sub{font-size:12px;color:var(--muted)}
.dish .x{margin-left:auto;flex:none}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,46%);gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start}
@media (min-width:640px){.hscroll{grid-auto-columns:220px}}
.reason{font-size:12px;background:var(--mint);border:2px solid var(--ink);border-radius:10px;padding:2px 8px;align-self:flex-start;font-family:var(--f-display)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);padding:10px 4px;font-family:var(--f-display);font-size:13.5px}
.qbtn svg{width:46px;height:46px}
.qbtn:active{transform:translateY(3px);box-shadow:none}

/* 表單列 */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:7px 10px}
.li .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;border:2px solid var(--ink)}
.li .ic svg{width:31px;height:31px}
.li .nm{font-family:var(--f-display);font-size:15px}
.li .q{margin-left:auto;font-family:var(--f-num);font-weight:600;white-space:nowrap}
.li.done{opacity:.55}
.li.done .nm{text-decoration:line-through}
.check{width:28px;height:28px;flex:none;border:3px solid var(--ink);border-radius:9px;background:var(--paper);display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--teal)}
.check[aria-checked="true"]::after{content:"";width:12px;height:7px;border-left:3.5px solid #fff;border-bottom:3.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.cat-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px;margin-top:6px}
.cat-h svg{width:34px;height:34px}
.ring{width:84px;height:84px;flex:none}

/* 彈出 sheet */
.backdrop{position:fixed;inset:0;background:rgba(16,57,59,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(30px)}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 0 10px;background:var(--bg)}
.sheet-h h3{font-size:20px}
.sheet-h .btn{margin-left:auto}
.sheet .body{display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-bottom:3px solid var(--ink);border-radius:26px;max-height:88%}}
.detail-ill{aspect-ratio:16/10;max-height:260px;width:100%}
.ing-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed var(--line)}
.ing-row:last-child{border-bottom:0}
.ing-row .ic{width:30px;height:30px;flex:none}
.ing-row .ic svg{width:30px;height:30px}
.ing-row .q{margin-left:auto;font-family:var(--f-num);font-weight:600}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.step .n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-num);font-weight:700}
.step.done .t{text-decoration:line-through;color:var(--muted)}
.nbar{display:grid;grid-template-columns:44px 1fr 52px;align-items:center;gap:8px;font-size:13px}
.nbar .track{height:12px;border-radius:6px;background:#e5f3f1;overflow:hidden;border:2px solid var(--ink)}
.nbar .fill{height:100%}

/* toast + tooltip */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:90%}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-family:var(--f-display);font-size:14.5px;animation:up .2s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
@media (min-width:900px){#toast{bottom:28px}}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:10px;display:none;white-space:nowrap;font-family:var(--f-body)}

/* AI */
.ai-off{display:flex;gap:10px;align-items:center;background:#fff1c9}
.ai-out{white-space:pre-wrap;line-height:1.7}
.loading-wok{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;font-family:var(--f-display)}
.loading-wok .w{width:110px;height:100px;position:relative}
.loading-wok .w>svg{width:110px;height:100px;animation:toss 1s ease-in-out infinite}
.loading-wok .bit{position:absolute;width:26px;height:26px;left:40px;top:0;animation:fly 1s ease-in-out infinite}
.loading-wok .bit:nth-child(3){animation-delay:.33s;left:20px}
.loading-wok .bit:nth-child(4){animation-delay:.66s;left:62px}
@keyframes toss{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg) translateY(-4px)}}
@keyframes fly{0%{transform:translateY(40px) scale(.6);opacity:0}40%{opacity:1}60%{transform:translateY(-14px) rotate(160deg)}100%{transform:translateY(40px) rotate(320deg);opacity:0}}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:14px;border:3px solid var(--ink)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px dashed var(--teal);border-radius:16px;padding:16px;background:#f4fcfb;text-align:center;font-family:var(--f-display)}
.dropzone svg{width:70px;height:70px}

/* 餐單 */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);padding:6px 2px;font-family:var(--f-display);font-size:12.5px}
.day .d{font-family:var(--f-num);font-size:18px;font-weight:700;line-height:1}
.day .dots{display:flex;gap:2px;height:7px;margin-top:4px}
.day .dots i{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.day.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.day.today .d{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.meals{display:grid;gap:12px}
@media (min-width:760px){.meals{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* 圖表 */
.chart{width:100%;overflow-x:auto}
.chart svg{width:100%;height:auto;min-width:300px}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.chart .val{fill:var(--ink);font-weight:700;font-family:var(--f-num)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--ink)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border-bottom:2px dashed var(--line);padding:5px 6px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* 工具 */
.tools{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.timer{display:flex;align-items:center;gap:12px;padding:8px 10px;border:2.5px solid var(--ink);border-radius:16px;background:var(--paper)}
.timer .t{font-family:var(--f-num);font-size:26px;font-weight:700;min-width:96px}
.timer.ring-done{background:var(--coral);animation:shake .4s 3}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.wheel-wrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:0 auto}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:34px;height:40px}
.conv{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.conv div{border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;background:#f6fcfb}
.conv b{display:block;font-family:var(--f-num);font-size:17px}
.conv span{font-size:12px;color:var(--muted)}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.icon-pick button{aspect-ratio:1;border:2.5px solid var(--ink);border-radius:12px;padding:2px;display:grid;place-items:center}
.icon-pick button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun);transform:scale(1.05)}
.icon-pick svg{width:100%;height:100%}
.erow{display:grid;grid-template-columns:1fr 70px 70px 34px;gap:6px;align-items:center}
.erow.st{grid-template-columns:1fr 64px 34px}
.cook{position:fixed;inset:0;z-index:70;background:var(--teal);color:#fff;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.cook .big{font-family:var(--f-display);font-size:clamp(22px,5.5vw,34px);line-height:1.45;flex:1;display:flex;align-items:center;max-width:760px;margin:0 auto}
.cook .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.3);overflow:hidden;border:2px solid var(--ink)}
.cook .bar i{display:block;height:100%;background:var(--sun)}

.mi{width:14px;height:14px;flex:none}
.pill .mi{width:13px;height:13px}
.plain{background:none;border:0;padding:0;margin:0;text-align:left;flex:1;min-width:0;cursor:pointer;color:inherit;font:inherit}
#timerChip:not(.hide)~.sync{margin-left:6px}
.mwrap{width:120px;height:110px;position:relative}
.deco svg{width:100%;height:100%}
@media (max-width:420px){.hero h1{font-size:23px}.mwrap{width:86px;height:80px}.hero .mascot{width:86px;height:80px}.hero{padding:14px}}
body.no-ai .needs-ai{display:none!important}
.only-no-ai{display:none!important}
body.no-ai .only-no-ai{display:inline-flex!important}
body.no-ai .qbtn.only-no-ai{display:flex!important}
#famQR svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function show(v, push = true) {

  if (v === 'ai') renderAI(); else if (v === 'tools') renderTools(); else refresh();

function refresh() {
  const v = RT.view; const view = $('#v-' + v); const act = document.activeElement;
  const keep = view ? $$('input[id],textarea[id],select[id]', view).filter(e => e.type !== 'file').map(e => [e.id, e.value]) : [];
  const fid = act && view && view.contains(act) && act.id ? act.id : null;
  let sel = null; try { sel = fid && act.selectionStart != null ? [act.selectionStart, act.selectionEnd] : null; } catch (e) { }
  if (v === 'home') renderHome(); else if (v === 'recipes') renderRecipes(); else if (v === 'plan') renderPlan();
  else if (v === 'shop') renderShop(); else if (v === 'stats') renderStats(); else if (v === 'tools') { renderPantry(); renderScaler(); }
  for (const [id, val] of keep) { const e = document.getElementById(id); if (e && e.value !== val && e.tagName !== 'SELECT') e.value = val; }
  if (fid) { const e = document.getElementById(fid); if (e && document.activeElement !== e) { e.focus({ preventScroll: true }); if (sel) try { e.setSelectionRange(sel[0], sel[1]); } catch (er) { } } }
  updateBadges(); setSync();
}

/* ===== 食譜簿 ===== */
function filteredRecipes() {
  let list;
  const f = RT.recFilter;
  if (f === 'mine') list = S.recipes.filter(r => r.src !== 'ai');
  else if (f === 'ai') list = S.recipes.filter(r => r.src === 'ai');
  else if (f === 'fav') list = allRecipes().filter(r => isFav(r.id));
  else if (f === 'lib') list = [...LIB];
  else list = allRecipes();
  if (RT.recType) list = list.filter(r => r.type === RT.recType);
  const q = RT.recQ.trim();
  if (q) list = list.filter(r => r.name.includes(q) || r.ings.some(i => i.n.includes(q)) || (r.tags || []).some(t => t.includes(q)));
  const s = RT.recSort;
  if (s === 'fast') list.sort((a, b) => a.time - b.time);
  else if (s === 'kcal') list.sort((a, b) => (a.kcal || 0) - (b.kcal || 0));
  else if (s === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  return list;
}

/* ===== 圖表 ===== */
function niceMax(v) { if (v <= 1) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function barPath(x, y, w, h, r = 4) { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x} ${y + h} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${y + h}Z`; }
function vBars({ labels, series, colors, names, unit, hi = [] }) {
  const W = 340, H = 200, L = 36, R = 8, T = 20, B = 26; const n = labels.length;
  const totals = labels.map((_, i) => series.reduce((s, ser) => s + (ser[i] || 0), 0));
  const top = Math.max(...totals, 1); const step = niceMax(top / 4); const max = step * Math.ceil(top * 1.05 / step);
  const pw = (W - L - R) / n; const bw = Math.min(26, pw * .56);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#d7ebe8" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  let bars = '';
  labels.forEach((lab, i) => {
    const x = L + pw * i + (pw - bw) / 2; let acc = 0; const segs = series.length;
    series.forEach((ser, si) => {
      const v = ser[i] || 0; if (!v) return;
      const y0 = y(acc + v), y1 = y(acc); let hgt = y1 - y0; const isTop = series.slice(si + 1).every(s2 => !(s2[i] > 0));
      const gap = segs > 1 && acc > 0 ? 2 : 0;
      hgt -= gap;
      bars += isTop ? `<path d="${barPath(x, y0, bw, hgt)}" fill="${colors[si]}"/>` : `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(0, hgt)}" fill="${colors[si]}"/>`;
      acc += v;
    });
    const tip = series.length > 1 ? `${lab}：` + series.map((ser, si) => `${names[si]} ${Math.round(ser[i] || 0)}`).join('，') + ` ${unit}` : `${lab}：${Math.round(totals[i])} ${unit}`;
    bars += `<rect x="${L + pw * i}" y="${T}" width="${pw}" height="${H - T - B}" fill="transparent" data-tip="${esc(tip)}"/>`;
    if (hi.includes(i) && totals[i] > 0) bars += `<text class="val" x="${x + bw / 2}" y="${y(totals[i]) - 6}" text-anchor="middle">${Math.round(totals[i])}</text>`;
    bars += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="棒形圖">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#9cc9c3" stroke-width="1.5"/>${bars}</svg></div>`;
}
function hBars(items, unit) {
  const W = 340, rowH = 34, L = 104, R = 40; const H = items.length * rowH + 6;
  const max = Math.max(...items.map(i => i.v), 1);
  const rows = items.map((it, i) => {
    const y = 4 + i * rowH; const w = (W - L - R) * it.v / max;
    return `<g data-tip="${esc(it.label)}：${it.v} ${unit}"><rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent"/>
      <svg x="0" y="${y + 3}" width="28" height="28" viewBox="-4 -4 108 104">${ICONS[it.icon]?.svg() || ''}</svg>
      <text x="32" y="${y + 21}" style="fill:#10393b;font-size:12.5px">${esc(it.label)}</text>
      <path d="${w > 0 ? `M${L} ${y + 9} H${L + w - 4} Q${L + w} ${y + 9} ${L + w} ${y + 13} V${y + 21} Q${L + w} ${y + 25} ${L + w - 4} ${y + 25} H${L}Z` : ''}" fill="var(--teal)"/>
      <text class="val" x="${L + w + 6}" y="${y + 22}">${it.v}</text></g>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="橫向棒形圖"><line x1="${L}" x2="${L}" y1="0" y2="${H}" stroke="#9cc9c3" stroke-width="1.5"/>${rows}</svg></div>`;
}
function tbl(head, rows) { return `<div class="chart"><table class="tbl"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }

function looseJSON(t) {
  t = String(t || '').replace(/```json|```/g, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw { code: 'bad', message: 'AI 回覆唔係食譜格式' };
  return JSON.parse(t.slice(a, b + 1));
}
async function askJSON(prompt, opts = {}) {
  if (typeof AI.s.json === 'function') {
    try { const v = await AI.s.json(prompt, opts); if (v && typeof v === 'object') return v; }
    catch (e) { if (e && ['not_granted', 'rate_limited', 'revoked', 'capability_disabled'].includes(e.code)) throw e; }
  }
  const r = await AI.s(prompt, opts);
  return looseJSON(r.text);
}
function aiErrHTML(e) {

  const msg = c === 'not_granted' ? '未批准使用 AI。再撳一次，喺彈出視窗揀允許就得。' : c === 'rate_limited' ? 'AI 而家太忙，等一兩分鐘再試。' : (e && e.message) ? 'AI 做唔到：' + e.message : 'AI 做唔到，再試一次。';

}

function num(v, a, b, d) { v = Number(v); return isFinite(v) ? Math.max(a, Math.min(b, Math.round(v))) : d; }
function normAI(o, fallbackName) {

  const ings = (Array.isArray(o.ings) ? o.ings : []).slice(0, 20).map(i => { const n = String(i?.n || i?.name || '').slice(0, 24); return { n, q: Number(i?.q) || 0, u: String(i?.u || '').slice(0, 8), cat: (CATS[i?.cat] || i?.cat === 'water') ? i.cat : ingInfo(n).cat }; }).filter(i => i.n);

  if (!ings.length || !steps.length) throw { code: 'bad', message: '冇俾齊材料同步驟，再試多次' };

}

/* ===== 相片 ===== */
async function resizeImage(file, max = 1024, q = .8) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = b => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });

    <div class="small muted" style="margin-top:8px">可以編輯嘅人先可以剔清單、加菜；只可以睇嘅人淨係睇到。有連結嘅人都可能睇到呢度嘅資料，請只分享俾屋企人。</div>

  const inviteFb = `<div class="card sun" style="box-shadow:none"><h3>邀請屋企人</h3><div class="small muted">屋企人用手機掃 QR code，或者撳 WhatsApp 收到嘅連結，就會加入同一個家庭。邀請碼好似鎖匙咁，只俾屋企人。</div>
    <div class="small" style="margin-top:6px"><b>iPhone 注意：</b>加咗去主畫面嘅 App 同 Safari 嘅資料係分開嘅。請先「加入主畫面」，再喺主畫面個 App 入面貼邀請碼加入。</div>
    <div id="famQR" class="hide" style="width:200px;max-width:70%;margin:10px auto;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px"></div>
    <div class="row wrap" style="margin-top:8px"><button class="btn sm pri" data-act="fbCopyLink">${li('copy')}複製邀請連結</button><button class="btn sm" data-act="fbCopyCode">${li('copy')}複製邀請碼</button></div>
    <button class="btn sm coral" style="margin-top:12px" data-act="fbLeave">離開家庭（之後只用呢部機）</button></div>`;
  const setupFb = `<div class="card sun" style="box-shadow:none"><div class="sec-h"><span class="ic" style="background:#fff">${iconSVG('soup')}</span><div><h3>唔使 Claude 嘅即時同步（Firebase 免費）</h3><div class="small muted">一個人設定一次（大約 10 分鐘），其他屋企人掃 QR code 就加入</div></div></div>
    ${!location.protocol.startsWith('http') ? `<div class="small" style="margin-top:8px;background:#ffe3dc;border-radius:10px;padding:6px 10px">要先將呢個 App 放上網（例如 Netlify），開網址嘅版本先做到同步。</div>` : ''}
    <ol style="margin:10px 0 0;padding-left:20px;line-height:1.75">
      <li>用 Google 帳戶開 <b>console.firebase.google.com</b>，撳「建立專案／Create a project」，改個名，Analytics 可以唔開。</li>
      <li>喺專案主頁撳網頁圖示「&lt;/&gt;」加一個 Web App，註冊後會見到一段 <b>firebaseConfig</b>，成段複製。</li>
      <li>左邊揀「Firestore Database」→「建立資料庫／Create database」，地點可以揀 asia-east2（香港），用正式版模式。</li>
      <li>去「規則／Rules」分頁，貼上下面嘅規則，撳「發布／Publish」。</li>
      <li>返嚟呢度，喺下面貼上 firebaseConfig，撳「建立家庭」。</li></ol>
    <div class="field" style="margin-top:10px"><label>Firestore 規則</label><textarea class="inp" rows="7" readonly id="fbRules" aria-label="Firestore 規則" style="font-family:ui-monospace,monospace;font-size:12px">${esc(FB_RULES)}</textarea><button class="btn sm" data-act="fbCopyRules" style="align-self:flex-start">${li('copy')}複製規則</button></div>
    <div class="field" style="margin-top:10px"><label for="fbCfg">貼上 firebaseConfig</label><textarea id="fbCfg" class="inp" rows="5" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, projectId: &quot;…&quot;, … };" style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
    <button class="btn pri" style="margin-top:8px" data-act="fbCreate">${li('check')}建立家庭</button>
    <div class="field" style="margin-top:14px"><label for="fbJoin">或者：屋企人已經設定好？貼上邀請碼／連結（iPhone 主畫面 App 請用呢度）</label><input id="fbJoin" class="inp" placeholder="WZFZ:… 或者 https://…#join=…"></div>
    <button class="btn" style="margin-top:8px" data-act="fbJoinGo">${li('people')}加入家庭</button></div>`;
  const share = `<div class="card" style="box-shadow:none"><div class="sec-h"><span class="ic" style="background:${iconBg('basket')}">${iconSVG('basket')}</span><div><h3>分享碼同備份</h3><div class="small muted">唔使任何帳戶：將清單、餐單、雪櫃同食譜變成一段文字，WhatsApp 傳俾屋企人，佢貼上就會合併</div></div></div>
    <div class="row wrap" style="margin-top:10px"><button class="btn sm pri" data-act="shareCopy">${li('copy')}複製分享碼</button>${k !== 'claude' ? `<button class="btn sm" data-act="backupDl">${li('copy')}下載完整備份檔</button><label class="btn sm" for="backupFile" style="cursor:pointer">匯入備份檔</label><input id="backupFile" type="file" accept="application/json,.json" class="hide">` : ''}</div>
    <div class="field" style="margin-top:10px"><label for="shareIn">貼上屋企人傳嚟嘅分享碼</label><textarea id="shareIn" class="inp" rows="3" placeholder="鑊仔食譜分享碼… WZ1Z:…"></textarea></div>
    <button class="btn sun" style="margin-top:8px" data-act="shareMerge">${li('check')}合併入我嘅資料</button></div>`;
  return `<div class="card ${db && Store.live ? 'tint' : ''}" style="box-shadow:none"><div class="row"><span style="width:52px;height:52px;flex:none">${iconSVG('wok')}</span><div><b>${Store.canWrite === false ? '你而家只可以睇' : head[0]}</b><div class="small muted">${head[1]}</div></div></div></div>
  ${db ? `<div class="card" style="box-shadow:none"><h3>屋企成員</h3><div class="chips" style="margin-top:8px" data-fam-members>${familyIds().map(id => memberChip(id, id === RT.me ? '（你）' : '')).join('')}</div></div>${who}` : ''}
  ${k === 'firebase' ? inviteFb : k === 'claude' ? inviteClaude : setupFb}
  ${taste}${share}`;
}
async function openFam() {
  const bd = openSheet('家庭共用', famHTML()); bd.dataset.fam = '1'; bd._fam = { icon: (S.members || {})[RT.me]?.icon || 'bun' };
  const f = $('#backupFile', bd);
  if (f) f.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try { const inc = JSON.parse(await file.text()); if (!inc || inc.app !== 'wokzai') throw 0; const n = mergeIn(inc.data || inc); save(); toast(`匯入咗 ${n} 樣嘢`); }
    catch (er) { toast('呢個唔係鑊仔食譜嘅備份檔'); }
  });
  if (Store.kind === 'firebase') { bd._invite = await packCode({ c: Store.fam.c, f: Store.fam.f }, 'WZF'); drawQR($('#famQR', bd), inviteLink(bd._invite) || bd._invite); }
}
function updateFamSheet() { const bd = $$('#sheets .backdrop').find(b => b.dataset.fam); if (!bd) return; const c = bd.querySelector('[data-fam-members]'); if (c) c.innerHTML = familyIds().map(id => memberChip(id, id === RT.me ? '（你）' : '')).join(''); }
async function joinWith(text) {
  let v; try { v = await unpackCode(String(text).replace(/^.*#join=/, ''), 'WZF'); } catch (e) { toast('邀請碼唔啱，請再複製一次'); return; }
  if (!v || !v.c || !v.c.apiKey || !v.f) { toast('邀請碼唔完整'); return; }
  if (Store.kind === 'claude') { toast('喺 Claude 入面已經有家庭共用，唔使用邀請碼'); return; }
  if (fbCfgSave({ c: v.c, f: v.f })) { Store.saveLocal(); toast('加入緊家庭…'); setTimeout(() => location.reload(), 600); }
}
Object.assign(ACTS, {
  fbCopyRules: () => copyOrShow(FB_RULES, 'Firestore 規則'),
  fbCreate: el => {
    const bd = sheetOf(el); const c = parseFbConfig($('#fbCfg', bd).value);
    if (!c) { toast('搵唔到 apiKey 同 projectId，請成段 firebaseConfig 貼上'); return; }
    if (fbCfgSave({ c, f: randCode(22) })) { Store.saveLocal(); toast('建立緊家庭，你嘅資料會一齊搬上去…'); setTimeout(() => location.reload(), 800); }
  },
  fbJoinGo: el => { const v = $('#fbJoin', sheetOf(el)).value.trim(); if (!v) { toast('貼上邀請碼先'); return; } joinWith(v); },
  fbCopyLink: el => { const bd = sheetOf(el); const l = inviteLink(bd._invite); if (!l) { toast('要放上網先有連結，可以用邀請碼'); return; } copyOrShow(`加入我哋屋企嘅鑊仔食譜：\n${l}`, '邀請連結'); },
  fbCopyCode: el => copyOrShow(sheetOf(el)._invite || '', '邀請碼'),
  fbLeave: el => {
    if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = '再撳一次確認離開'; return; }
    try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 2, init: true, favs: S.favs, plan: prunePlan(S.plan), shop: S.shop, pantry: S.pantry, settings: S.settings, members: S.members, log: S.log, recipes: S.recipes })); localStorage.removeItem(FB_KEY); } catch (e) { }
    toast('離開咗家庭，資料留咗一份喺呢部機'); setTimeout(() => location.reload(), 700);
  },
  shareCopy: async () => { try { copyOrShow(await shareText(), '分享碼'); } catch (e) { toast('整唔到分享碼'); } },
  shareMerge: async el => {
    const bd = sheetOf(el); const t = $('#shareIn', bd).value;
    try { const inc = await unpackCode(t, 'WZ1'); const n = mergeIn(inc); save(); $('#shareIn', bd).value = ''; toast(n ? `合併咗 ${n} 樣嘢` : '冇新嘢要合併'); }
    catch (e) { toast('搵唔到分享碼，請成段貼上'); }
  },
  backupDl: () => downloadText(`鑊仔食譜備份-${TODAY()}.json`, JSON.stringify({ app: 'wokzai', v: 2, at: new Date().toISOString(), data: { recipes: S.recipes, favs: S.favs, plan: S.plan, shop: S.shop, pantry: S.pantry, settings: S.settings, members: S.members, log: S.log } })),
  joinYes: el => { const bd = sheetOf(el); closeSheet(bd); joinWith(RT.joinCode); },
});

/* ===== 啟動 ===== */
async function boot() {
  renderTabs();
  const chip = document.createElement('button'); chip.id = 'timerChip'; chip.className = 'pill sun hide'; chip.dataset.act = 'timerGo'; chip.style.marginLeft = 'auto'; chip.style.cursor = 'pointer';
  $('header.top').insertBefore(chip, $('#sync'));
  let h = location.hash.slice(1);
  if (h.startsWith('join=')) { RT.joinCode = decodeURIComponent(h.slice(5)); h = 'home'; try { history.replaceState(null, '', location.pathname + location.search + '#home'); } catch (e) { } }
  if (S.demo) addDaysToShop([TODAY()], true);
  restoreTimers();
  show(VIEWS.some(x => x[0] === h) ? h : 'home', false);
  setSync();
  await Store.init();
  if (RT.fbErr) toast('連唔到 Firebase，暫時用呢部機嘅資料');
  if (Store.kind === 'firebase') { const data = await Store.loadLocal(); if (data && (data.init || (data.recipes && data.recipes.length))) S = normalize(data); RT.seed = S.demo ? null : clone(S); }
  if (Store.mode === 'db') {
    Store.subscribe((docs, meta) => {
      if (docs === null) {
        if (Store.kind === 'firebase' && meta && meta.timeout && RT.ready && !Store.live) toast('仲未連到 Firebase：如果一直咁，檢查網絡、firebaseConfig 同規則');
        if (!RT.ready) { RT.ready = true; refresh(); toast(meta && meta.error ? (Store.kind === 'firebase' ? '連唔到家庭資料：檢查 Firestore 規則同設定' : '連唔到家庭資料，等陣再試') : '網絡有啲慢，家庭資料載入緊'); }
        setSync(); return;
      }
      if (!Object.keys(docs).length) {
        if (meta.fromCache) { if (Store.kind === 'firebase' && !RT.ready) { RT.ready = true; refresh(); } return; }
        if (!RT.readyServer) {
          RT.readyServer = true; RT.ready = true; refresh();
          if (Store.kind === 'firebase') { if (!S.demo || RT.pending) { RT.pending = false; Store.sync(); toast('家庭建立好喇，你嘅資料已經上載'); } }
          else maybeMigrate().then(done => { if (!done && RT.pending) { RT.pending = false; Store.sync(); } });
        } else if (RT.pending) { RT.pending = false; Store.sync(); }
        setSync(); return;
      }
      S = stateFromDocs(docs);
      const first = !RT.ready; RT.ready = true; RT.pending = false;
      if (!meta.fromCache && !RT.readyServer) {
        RT.readyServer = true;
        if (RT.seed) { const extra = RT.seed.recipes.filter(r => !r.demo && !S.recipes.some(x => x.id === r.id)); RT.seed = null; if (extra.length) { S.recipes.push(...extra); Store.sync(); toast(`將你 ${extra.length} 個食譜加入咗家庭`); } }
      }
      scheduleRefresh(); resolveNames();
      if (first && RT.view === 'tools') setTimeout(renderTools, 0);
    });
  } else {
    const data = await Store.loadLocal();
    if (data && (data.init || (data.recipes && data.recipes.length))) S = normalize(data);
    RT.ready = true; if (RT.pending && !S.demo) Store.saveLocal();
    refresh(); if (RT.view === 'tools') renderTools();
  }
  if (RT.joinCode) openSheet('加入家庭？', `<div class="row"><span style="width:56px;height:56px;flex:none">${iconSVG('wok')}</span><div>有屋企人邀請你加入佢哋嘅鑊仔食譜。加入之後，清單、餐單同雪櫃會同佢哋即時同步。</div></div><div class="row wrap"><button class="btn pri" data-act="joinYes">${li('people')}加入</button><button class="btn" data-act="closeSheet">唔加入</button></div>`);
  initAI();
  if (window.WZ_STANDALONE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v.startsWith('join=')) { location.reload(); return; } if (v && v !== RT.view) show(v, false); });
boot();
</script>
</body>
</html>
